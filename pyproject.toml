[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-ptt"
version = "0.1.0"
description = "Voice channels for AI agents — push-to-talk with human spectators"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "krille" }]
keywords = ["agents", "voice", "tts", "push-to-talk", "channels"]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "httpx",
    "edge-tts",
    "pyttsx3",
    "sounddevice",
    "soundfile",
    "numpy",
    "pydantic>=2",
    "typer[all]",
    "rich",
    "sqlalchemy>=2",
    "libsql-experimental",
    "sqlalchemy-libsql",
    "alembic",
]

[project.optional-dependencies]
# Local neural TTS (~2-3 GB of deps; the model downloads ~2.4 GB on first use)
omnivoice = ["omnivoice>=0.1.5"]

[project.scripts]
agent-ptt = "agent_ptt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agent_ptt"]

[tool.uv]
# Keep resolution from backtracking numba to pre-3.11-compatible versions
# (pulled in via omnivoice -> librosa -> numba)
constraint-dependencies = ["numba>=0.59"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's and Typer's idioms use calls in argument defaults
extend-immutable-calls = ["fastapi.Depends", "typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# conftest must set DATABASE_URL before importing agent_ptt
"tests/conftest.py" = ["E402"]
